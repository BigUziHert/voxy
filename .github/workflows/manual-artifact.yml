name: manual-artifact

on: [ workflow_dispatch ]
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          cache-cleanup: always

      - name: Gradle build
        run: ./gradlew build

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: voxy-artifacts
          # Loom also drops the un-remapped -dev jar in build/libs, and archive:false only
          # accepts a single file, so narrow this to the jar that actually ships.
          path: |
            build/libs/*.jar
            !build/libs/*-dev.jar
            !build/libs/*-sources.jar
          archive: false